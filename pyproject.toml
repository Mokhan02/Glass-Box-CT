[project]
name = "glassbox-ct"
version = "0.0.1"
description = "Interpreting NVIDIA's NV-Segment-CT (VISTA-3D) with probes and sparse autoencoders, plus a Nemotron agent. Research use only."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "nibabel",
  "scikit-learn",
  "torch",
  "monai",
  "openai",
  "fastapi",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["glassbox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
